apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-pull-policy
  annotations:
    policies.kyverno.io/title: Require Specific Image Pull Policy
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      Containers should use 'Always' or 'IfNotPresent' as imagePullPolicy.
      Using 'Always' ensures the latest image is pulled, while 'IfNotPresent'
      optimizes for performance with cached images.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-image-pull-policy
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
      validate:
        message: "imagePullPolicy must be 'Always' or 'IfNotPresent', not 'Never'"
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                any:
                  - key: "{{ element.imagePullPolicy || 'Always' }}"
                    operator: Equals
                    value: "Never"
