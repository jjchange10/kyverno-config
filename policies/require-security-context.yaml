apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-security-context
  annotations:
    policies.kyverno.io/title: Require Security Context
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must run as non-root and not allow privilege escalation.
      This reduces the attack surface and follows security best practices.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
      validate:
        message: "Containers must run as non-root user (runAsNonRoot: true)"
        foreach:
          - list: "request.object.spec.containers[]"
            pattern:
              securityContext:
                runAsNonRoot: true
    - name: check-privilege-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
      validate:
        message: "Privilege escalation must be disabled (allowPrivilegeEscalation: false)"
        foreach:
          - list: "request.object.spec.containers[]"
            pattern:
              securityContext:
                allowPrivilegeEscalation: false
    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
      validate:
        message: "Containers must drop all capabilities"
        foreach:
          - list: "request.object.spec.containers[]"
            pattern:
              securityContext:
                capabilities:
                  drop:
                    - ALL
