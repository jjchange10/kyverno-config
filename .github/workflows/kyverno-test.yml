name: Kyverno Policy Validation

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  validate-policies:
    runs-on: ubuntu-latest
    name: Validate Kyverno Policies

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        run: |
          wget -qO- https://github.com/kyverno/kyverno/releases/download/v1.12.0/kyverno-cli_v1.12.0_linux_x86_64.tar.gz | tar -xz
          sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Test Policies Against Resources
        run: |
          echo "Testing policies against resources with values file..."
          echo "Using values.yaml to mock apiCall context variables"
          if [ -f "values.yaml" ] && [ -d "policies" ] && [ -d "resources/test-resources" ]; then
            kyverno apply policies/ \
              --resource resources/test-resources/ \
              --values-file values.yaml || exit 1
          else
            echo "Skipping: Required files not found"
          fi

      - name: Run Kyverno Test (if test.yaml exists)
        run: |
          if [ -f "kyverno-test.yaml" ]; then
            echo "Running kyverno test..."
            kyverno test .
          else
            echo "No kyverno-test.yaml found, skipping kyverno test"
          fi
