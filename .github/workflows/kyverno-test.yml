name: Kyverno Policy Validation

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

jobs:
  validate-policies:
    runs-on: ubuntu-latest
    name: Validate Kyverno Policies

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        run: |
          wget -qO- https://github.com/kyverno/kyverno/releases/download/v1.12.0/kyverno-cli_v1.12.0_linux_x86_64.tar.gz | tar -xz
          sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Test Policies Against Resources
        run: |
          echo "Testing policies against resources..."
          echo "Note: Policies with apiCall (context) are skipped in kyverno apply"
          echo "Applying basic policies (require-labels, disallow-latest-tag)..."
          if [ -f "policies/require-labels.yaml" ] && [ -f "resources/test-resources/good-pod.yaml" ]; then
            kyverno apply policies/require-labels.yaml policies/disallow-latest-tag.yaml \
              --resource resources/test-resources/good-pod.yaml \
              --resource resources/test-resources/good-deployment.yaml || exit 1
          else
            echo "Skipping: Basic policy files not found"
          fi

      - name: Run Kyverno Test (if test.yaml exists)
        run: |
          if [ -f "kyverno-test.yaml" ]; then
            echo "Running kyverno test..."
            kyverno test .
          else
            echo "No kyverno-test.yaml found, skipping kyverno test"
          fi
