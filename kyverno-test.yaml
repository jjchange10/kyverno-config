name: kyverno-policy-test
policies:
  - policies/require-labels.yaml
  - policies/disallow-latest-tag.yaml
  - policies/require-hpa.yaml
  - policies/require-semver-tag.yaml
resources:
  - resources/test-resources/good-pod.yaml
  - resources/test-resources/good-deployment.yaml
  - resources/test-resources/good-hpa.yaml
results:
  - policy: require-labels
    rule: check-for-labels
    resource: good-pod
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: require-image-tag
    resource: good-pod
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    rule: validate-image-tag
    resource: good-pod
    kind: Pod
    result: pass
  - policy: require-labels
    rule: check-for-labels
    resource: myapp-deployment
    kind: Deployment
    result: pass
  - policy: validate-hpa-configuration
    rule: validate-hpa-has-target
    resource: myapp-hpa
    kind: HorizontalPodAutoscaler
    result: pass
  - policy: validate-hpa-configuration
    rule: validate-hpa-replicas
    resource: myapp-hpa
    kind: HorizontalPodAutoscaler
    result: pass
  - policy: require-semver-image-tag
    rule: validate-image-tag-format
    resource: good-pod
    kind: Pod
    result: pass
  - policy: require-semver-image-tag
    rule: validate-image-tag-format
    resource: myapp-deployment
    kind: Deployment
    result: pass
